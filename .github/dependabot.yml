version: 2
updates:
  # 1. Keep Maven dependencies up to date
  - package-ecosystem: "maven"
    directory: "/" # Location of your pom.xml (change if in a subdirectory)
    schedule:
      interval: "daily" # Can be daily, weekly, or monthly
    open-pull-requests-limit: 10
    ignore:
    - dependency-name: "org.junit.jupiter:*" # or "junit:junit" / wildcard for JUnit 6
      versions: ["6.x", ">=6.0"]

  # 2. Optional: Keep your GitHub Actions workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
