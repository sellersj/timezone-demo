name: Build Maven Project and Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up the Java Development Kit (JDK)
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven' # Automatically caches Maven dependencies to speed up subsequent builds

    # Step 3: Compile and package the Java application into a JAR
    - name: Build with Maven
      run: mvn --batch-mode clean package

    # Step 4: Set up Docker Buildx (enables advanced build capabilities)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 5: Log in to Docker Hub
    # You must add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to your GitHub Repository Secrets
#    - name: Log in to Docker Hub
#      uses: docker/login-action@v3
#      with:
#        username: ${{ secrets.DOCKERHUB_USERNAME }}
#        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 6: Build the Docker image and push it to the registry
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        # Replace 'your-dockerhub-username/your-repo-name' with your actual repository information
#        tags: |
#          ${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name:latest
#          ${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name:${{ github.sha }}
